# Настройка туннеля на сервере. Тот же туннель, что работает сейчас:
# идентификатор и файл ключей — ваши, менять не нужно.

tunnel: ИДЕНТИФИКАТОР-ТУННЕЛЯ
credentials-file: /home/kvitka/.cloudflared/ИДЕНТИФИКАТОР-ТУННЕЛЯ.json

protocol: http2
edge-ip-version: "4"

# Боевой адрес — kvitka.example. Всё остальное падает в заглушку внизу
# и получает 404. Понадобится второй домен — допишите его двумя строками
# выше заглушки.
ingress:
  - hostname: kvitka.example
    service: http://127.0.0.1:8000
  - hostname: www.kvitka.example
    service: http://127.0.0.1:8000
  - service: http_status:404
