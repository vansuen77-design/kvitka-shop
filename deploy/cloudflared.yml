# Tunnel configuration on the server. The same tunnel you already have:
# the id and the credentials file are yours.

tunnel: TUNNEL-ID
credentials-file: /home/kvitka/.cloudflared/TUNNEL-ID.json

protocol: http2
edge-ip-version: "4"

# Live address - kvitka.example. Everything else falls into the catch-all
# below and gets a 404. Need a second domain - add it two lines above
# the catch-all.
ingress:
  - hostname: kvitka.example
    service: http://127.0.0.1:8000
  - hostname: www.kvitka.example
    service: http://127.0.0.1:8000
  - service: http_status:404
