{% load i18n %}
{% comment %}Одно поле формы заказа: подпись, звёздочка или «необязательно», ошибка.
  required=True — поле обязательно только при курьере, форма проверяет это сама.{% endcomment %}
<label class="field">
  <span class="field__label">{{ field.label }}{% if field.field.required or required %} <i>*</i>{% else %} <em class="field__optional">{% trans "необязательно" %}</em>{% endif %}</span>
  {{ field }}
  {% if field.errors %}<span class="field__error">{{ field.errors|join:" " }}</span>{% endif %}
</label>
